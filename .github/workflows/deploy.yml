name: Test, Build and Deploy

# Workflow triggers:
# 1. Push su main/master/feature: test e lint soltanto.
# 2. Pull Request: test e lint soltanto.
# 3. Il deploy richiede sempre workflow_dispatch esplicito con deploy=true.

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'  # Test anche i branch feature/* (no deploy)
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Trigger manuale
    inputs:
      branch:
        description: 'Branch da deployare'
        required: true
        default: 'main'
        type: string
      commit:
        description: 'Commit specifico (opzionale, lascia vuoto per ultimo)'
        required: false
        type: string
      deploy:
        description: 'Fare anche il deploy?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  test:
    name: Run Tests and Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Checkout specific commit (if provided)
        if: github.event.inputs.commit != ''
        run: git checkout ${{ github.event.inputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: test
    # Il deploy non parte mai da un push: serve un'azione manuale esplicita.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' 

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          submodules: recursive

      - name: Checkout specific commit (if provided)
        if: github.event.inputs.commit != ''
        run: git checkout ${{ github.event.inputs.commit }}

      - name: Get commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy, build and restart
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_PORT: ${{ secrets.APP_PORT }}
          WP_CONTENT_PATH: ${{ secrets.WP_CONTENT_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          command_timeout: 20m
          envs: COMMIT_SHA,DEPLOY_PATH,APP_PORT,WP_CONTENT_PATH
          script: |
            cd "$DEPLOY_PATH"

            echo "=== Pulling latest code ==="
            git fetch origin
            git reset --hard $COMMIT_SHA
            echo "Deploying commit: $(git log --oneline -1)"

            echo "=== Cleaning build cache ==="
            rm -rf .nuxt

            echo "=== Installing dependencies ==="
            npm ci || { echo "npm ci failed"; exit 1; }

            echo "=== Building application (site stays up during build) ==="
            npm run build || { echo "Build failed!"; exit 1; }

            if [ -z "$WP_CONTENT_PATH" ] || [ ! -d "$WP_CONTENT_PATH" ]; then
              echo "WP_CONTENT_PATH missing or invalid"
              exit 1
            fi
            chmod o+x .output
            chmod -R o+rX .output/public
            ln -sfn "$WP_CONTENT_PATH" .output/public/wp-content

            echo "=== Restarting PM2 ==="
            pm2 restart wikiherbalist || pm2 start .output/server/index.mjs --name wikiherbalist -- --port "$APP_PORT"
            pm2 save

            echo "=== PM2 status ==="
            pm2 list

            echo "=== Deployment completed! ==="
